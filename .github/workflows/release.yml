name: Build release binaries

# Builds a macOS .dmg and a Windows .exe from the Tkinter GUI and attaches them
# to the GitHub Release that triggered the run. Also runnable manually
# (workflow_dispatch) to smoke-test the packaging without cutting a release.
#
# Note: the binaries bundle Python + Tk, but NOT ffmpeg/ffprobe. Those remain a
# runtime dependency (the app warns if they're missing) — bundling ffmpeg would
# add ~80 MB and pull in its licensing. See README for details.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # required for attaching assets to the release

env:
  APP_NAME: SDR-S50-Converter

jobs:
  # ----------------------------------------------------------------- macOS #
  macos:
    name: macOS .dmg
    runs-on: macos-latest   # Apple Silicon runner -> arm64 build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest test_core -v

      - name: Build .app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "$APP_NAME" \
            --osx-bundle-identifier "com.larszu.sdrs50converter" \
            mod_convert_gui.py

      - name: Package .dmg
        run: |
          # Lay out a staging folder with the app and an /Applications symlink
          # so users can drag-to-install, then compress it into a UDZO .dmg.
          mkdir -p dmg-staging
          cp -R "dist/$APP_NAME.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/$APP_NAME.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/${{ env.APP_NAME }}.dmg

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.dmg

  # --------------------------------------------------------------- Windows #
  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest test_core -v

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${env:APP_NAME}"
          mod_convert_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/${{ env.APP_NAME }}.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.exe
