name: Build release binaries

# Builds a macOS .dmg and a Windows .exe from the Tkinter GUI and attaches them
# to the GitHub Release that triggered the run. Also runnable manually
# (workflow_dispatch) to smoke-test the packaging without cutting a release.
#
# ffmpeg + ffprobe are bundled INSIDE the app, so the download is fully
# self-contained — nothing to install. These are GPL builds (libx264 is
# GPL-licensed and our encoding pipeline needs it); see THIRD-PARTY.md for the
# resulting distribution obligations.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # required for attaching assets to the release

env:
  APP_NAME: SDR-S50-Converter
  # Pinned so a release build is reproducible; bump deliberately.
  MAC_FFMPEG_TAG: b6.0
  WIN_FFMPEG_ZIP: ffmpeg-master-latest-win64-gpl.zip

jobs:
  # ----------------------------------------------------------------- macOS #
  macos:
    name: macOS .dmg
    runs-on: macos-latest   # Apple Silicon runner -> arm64 build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Fetch ffmpeg + ffprobe (arm64)
        run: |
          set -euo pipefail
          mkdir -p vendor
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/${MAC_FFMPEG_TAG}"
          for tool in ffmpeg ffprobe; do
            curl -fsSL --retry 3 --retry-delay 5 -o "vendor/$tool" "$base/$tool-darwin-arm64"
            chmod +x "vendor/$tool"
            # Re-sign ad hoc: arm64 refuses to execute binaries whose signature
            # doesn't match after download/repackaging.
            codesign --force --sign - "vendor/$tool"
          done
          file vendor/ffmpeg
          # Fail loudly here rather than shipping a broken app.
          vendor/ffmpeg -hide_banner -version | head -1
          vendor/ffprobe -hide_banner -version | head -1
          vendor/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264

      - name: Build .app bundle
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed \
            --name "$APP_NAME" \
            --osx-bundle-identifier "com.larszu.sdrs50converter" \
            --add-binary "vendor/ffmpeg:." \
            --add-binary "vendor/ffprobe:." \
            mod_convert_gui.py

      - name: Sign bundle and verify ffmpeg is inside
        run: |
          set -euo pipefail
          # Ad-hoc sign the finished bundle so Gatekeeper lets it launch at all.
          codesign --force --deep --sign - "dist/$APP_NAME.app"
          found=$(find "dist/$APP_NAME.app" -name ffmpeg -type f | head -1)
          test -n "$found" || { echo "ffmpeg missing from bundle"; exit 1; }
          echo "bundled at: $found"
          "$found" -hide_banner -version | head -1

      - name: Package .dmg
        run: |
          set -euo pipefail
          # Staging folder with the app plus an /Applications symlink so users
          # can drag-to-install, then compress into a UDZO .dmg.
          mkdir -p dmg-staging
          cp -R "dist/$APP_NAME.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          cp THIRD-PARTY.md dmg-staging/ 2>/dev/null || true
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/$APP_NAME.dmg"
          ls -lh "dist/$APP_NAME.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/${{ env.APP_NAME }}.dmg

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.dmg

  # --------------------------------------------------------------- Windows #
  windows:
    name: Windows .exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # keep the scripting identical to the macOS job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Fetch ffmpeg + ffprobe (win64)
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fsSL --retry 3 --retry-delay 5 -o ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${WIN_FFMPEG_ZIP}"
          unzip -q ffmpeg.zip -d ffmpeg-extract
          # The zip nests everything under a versioned folder; find the exes.
          find ffmpeg-extract -name 'ffmpeg.exe'  -exec cp {} vendor/ \;
          find ffmpeg-extract -name 'ffprobe.exe' -exec cp {} vendor/ \;
          test -f vendor/ffmpeg.exe && test -f vendor/ffprobe.exe
          ./vendor/ffmpeg.exe -hide_banner -version | head -1
          ./vendor/ffmpeg.exe -hide_banner -encoders 2>/dev/null | grep -q libx264

      - name: Build .exe
        run: |
          set -euo pipefail
          # Note the ';' separator for --add-binary on Windows.
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "$APP_NAME" \
            --add-binary "vendor/ffmpeg.exe;." \
            --add-binary "vendor/ffprobe.exe;." \
            mod_convert_gui.py
          ls -lh "dist/$APP_NAME.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/${{ env.APP_NAME }}.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.exe
